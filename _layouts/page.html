---
# Front matter keeps Jekyll processing enabled.
---
<!doctype html>
<html lang="en-AU">
  {% include head.html %}
  <body class="legal-body">
    <header class="site-header legal-header">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="Make Me Cartoon home">
        <img src="{{ '/assets/images/app-icon-256.png' | relative_url }}" width="44" height="44" alt="">
        <span>Make Me Cartoon</span>
      </a>
      <a class="button button-small" href="{{ site.appstore_link }}">Get the app</a>
    </header>
    <main class="legal-shell">
      <article class="legal-content">{{ content }}</article>
    </main>
    <footer class="legal-footer"><a href="{{ '/' | relative_url }}">Back to home</a></footer>
  </body>
</html>
