# Site identity, used by jekyll-seo-tag for titles, descriptions and social cards
title                                     : Make Me Cartoon
tagline                                   : Turn Photos into Cartoons and Art
description                               : Turn your photos into cartoons, illustrated portraits, collectible toys, new scenes, restored memories and family collages on iPhone.
locale                                    : en_AU
url                                       : https://ktoon.karmaacademy.com.au
baseurl                                   : ""

# App Info
ios_app_id                                : 6744203926                                # Required. Enter iOS app ID to automatically populate name, price and icons (e.g. 718043190).

appstore_link                             : https://apps.apple.com/app/id6744203926                                          # Automatically populates if not set and if iOS app ID is set. Otherwise enter manually.
playstore_link                            :                                           # Enter Google Play Store URL.
presskit_download_link                    :                                           # Enter a link to downloadable file or (e.g. public Dropbox link to a .zip file).
                                                                                      # Or upload your press kit file to assets and set path accordingly (e.g. "assets/your_press_kit.zip").

app_icon                                  : appicon.png                      # Automatically populates if not set and if iOS app ID is set.  Otherwise enter path to icon file manually.
app_name                                  : Make Me Cartoon
app_price                                 : 0                                          # Automatically populates if not set and if iOS app ID is set.  Otherwise enter manually.
app_publisher                             : Karma Academy

enable_smart_app_banner                   : true                                      # Set to true to show a smart app banner at top of page on mobile devices.



# Information About Yourself
your_name                                 : Make Me Cartoon Team
your_link                                 : https://ktoon.karmaacademy.com.au
your_city                                 : Brisbane
email_address                             : support@karmaacademy.com.au
facebook_username                         :                                           
instagram_username                        :
twitter_username                          : 
github_username                           :
youtube_username                          :



# Feature List                            Edit, add or remove features to be presented.
features                                  :

  - title                                 : Cartoon Generation
    description                           : Choose from different styles of selection and generate new images
    fontawesome_icon_name                 : image  

  - title                                 : Accurate Transformation
    description                           : Transform images with accurate transformation.
    fontawesome_icon_name                 : image

  - title                                 : User Interface
    description                           : Modern UI 
    fontawesome_icon_name                 : mobile

# Homepage FAQs live in _data/faqs.yml

# Theme Settings
topbar_color                              : "#000000"
topbar_transparency                       : 0.1
topbar_title_color                        : "#ffffff"

cover_image                               : assets/headerimage.png                    # Replace with alternative image path or image URL.
cover_overlay_color                       : "#363b3d"
cover_overlay_transparency                : 0.8

device_color                              : black                                     # Set to: blue, black, yellow, coral or white.

body_background_color                     : "#ffffff"

link_color                                : "#1d63ea"

app_title_color                           : "#ffffff"
app_price_color                           : "#ffffff"
app_description_color                     : "#ffffff"

feature_title_color                       : "#000000"
feature_text_color                        : "#666666"

feature_icons_foreground_color            : "#1d63ea"
feature_icons_background_color            : "#e6e6e6"

social_icons_foreground_color             : "#666666"
social_icons_background_color             : "#e6e6e6"

footer_text_color                         : "#666666"





####################################################
### Jekyll Configuration. No need to touch this. ###
####################################################

# Set the Sass partials directory, as we're using @imports
sass:
  style: :compressed # You might prefer to minify using :compressed

# SEO tags and sitemap come from the plugins bundled with GitHub Pages
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Default social share image for every page (1200 x 630, the size Facebook recommends)
defaults:
  - scope:
      path: ""
    values:
      image:
        path: /assets/images/share-before-after.jpg
        width: 1200
        height: 630
        alt: A family photo shown before and after it was turned into illustrated art with Make Me Cartoon

# Exclude these files from your production _site
exclude:
  - LICENSE
  - README.md
  - CNAME
  - Gemfile
  - Gemfile.lock
  - vendor
  - design-qa.md

# Markdown rendering
markdown: kramdown
include: [".well-known"]
