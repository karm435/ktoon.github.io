<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5efe5">
  <meta name="robots" content="index, follow, max-image-preview:large">

  {% assign meta_title = page.title | default: site.page_title %}
  {% assign meta_description = page.description | default: site.app_description %}
  <title>{{ meta_title }}</title>
  <meta name="description" content="{{ meta_description }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Make Me Cartoon">
  <meta property="og:title" content="{{ meta_title }}">
  <meta property="og:description" content="{{ meta_description }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ '/assets/images/family-after.jpg' | absolute_url }}">
  <meta property="og:image:width" content="1120">
  <meta property="og:image:height" content="1408">
  <meta property="og:image:alt" content="A family portrait transformed into warm illustrated artwork">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ meta_title }}">
  <meta name="twitter:description" content="{{ meta_description }}">
  <meta name="twitter:image" content="{{ '/assets/images/family-after.jpg' | absolute_url }}">

  <link rel="icon" type="image/png" href="{{ '/assets/images/app-icon.png' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/assets/images/app-icon.png' | relative_url }}">
  {% if site.enable_smart_app_banner %}<meta name="apple-itunes-app" content="app-id={{ site.ios_app_id }}">{% endif %}

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  <script defer src="{{ '/assets/js/site.js' | relative_url }}"></script>
</head>
